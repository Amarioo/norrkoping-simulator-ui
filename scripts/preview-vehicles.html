<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        background: #c5d3da;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { createPublicTransport } from '/src/lib/publicTransport.ts';
      const kind = new URLSearchParams(location.search).get('kind') || 'tram',
        renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(1400, 800);
      renderer.setPixelRatio(1);
      document.body.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#b8c8ce');
      scene.add(new THREE.AmbientLight('#fff4e0', 2));
      const light = new THREE.DirectionalLight('#ffffff', 3);
      light.position.set(2, 4, 5);
      scene.add(light);
      const model = createPublicTransport();
      scene.add(model.group);
      const count = kind === 'train' ? 4 : 5,
        spacing = kind === 'train' ? 0.8 : 0.256,
        sections = Array.from({ length: count }, (_, i) => ({
          pos: [0, 0, -i * spacing],
          heading: 0,
        }));
      model.update(
        [
          {
            id: 1,
            kind,
            pos: [0, 0, 0],
            heading: 0,
            speed: 0,
            road: 'Spårvagn 2',
            stopped: true,
            sections,
          },
        ],
        1,
      );
      const camera = new THREE.PerspectiveCamera(40, 1400 / 800, 0.01, 100);
      camera.position.set(
        kind === 'train' ? 2.7 : 1.3,
        kind === 'train' ? 1.2 : 0.55,
        kind === 'train' ? 2.1 : 1.1,
      );
      camera.lookAt(0, 0.07, (-(count - 1) * spacing) / 2);
      renderer.render(scene, camera);
      window.previewReady = true;
    </script>
  </body>
</html>
