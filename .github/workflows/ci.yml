name: Frontend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npx --yes npm@11.10.1 ci
      - run: npm run check
      - run: npm test
      - run: npm run build
